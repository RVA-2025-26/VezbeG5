<mat-toolbar color="primary">
    <span class="title-center">Stavka za porudžbinu: {{ childSelectedPorudzbina.id }}</span>
  </mat-toolbar>
 
  <div class="container mat-elavation-z8">
    <table mat-table matSort [dataSource]="dataSource" class="mat-cell">
      <!-- ID -->
      <ng-container matColumnDef="id">
        <th mat-header-cell mat-sort-header *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let row">{{ row.id }}</td>
      </ng-container>
 
     
      <ng-container matColumnDef="redniBroj">
        <th mat-header-cell mat-sort-header *matHeaderCellDef>Redni Broj</th>
        <td mat-cell *matCellDef="let row">{{ row.redniBroj}}</td>
      </ng-container>
 
     
      <ng-container matColumnDef="kolicina">
        <th mat-header-cell mat-sort-header *matHeaderCellDef>Kolicina</th>
        <td mat-cell *matCellDef="let row">{{ row.kolicina }}</td>
      </ng-container>

      <ng-container matColumnDef="jedinicaMere">
        <th mat-header-cell mat-sort-header *matHeaderCellDef>Jedinica mere</th>
        <td mat-cell *matCellDef="let row">{{ row.jedinicaMere }}</td>
      </ng-container>

      <ng-container matColumnDef="placeno">
        <th mat-header-cell mat-sort-header *matHeaderCellDef>Placeno</th>
        <td mat-cell *matCellDef="let row">{{ row.placeno }}</td>
      </ng-container>

      <ng-container matColumnDef="cena">
        <th mat-header-cell mat-sort-header *matHeaderCellDef>Cena</th>
        <td mat-cell *matCellDef="let row">{{ row.cena }}</td>
      </ng-container>

      <ng-container matColumnDef="artikl">
        <th mat-header-cell *matHeaderCellDef>Artikl</th>
        <td mat-cell *matCellDef="let row">{{ row.artikl.naziv }}</td>
      </ng-container>
 
      <!-- Action Buttons -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>
          <button mat-icon-button (click)="openDialog(1)">
            <mat-icon color="accent">add</mat-icon>
          </button>
        </th>
        <td mat-cell *matCellDef="let row; let i = index">
          <button mat-icon-button (click)="openDialog(2,row.id, row.redniBroj, row.kolicina, row.jedinicaMere, row.cena, row.artikl)">
            <mat-icon color="primary" aria-label="Edit">edit</mat-icon>
          </button>
          <button mat-icon-button (click)="openDialog(3,row.id, row.redniBroj, row.kolicina, row.jedinicaMere, row.cena, row.artikl)">
            <mat-icon color="warn" aria-label="Delete">delete</mat-icon>
          </button>
        </td>
      </ng-container>
 
      <!-- Rows -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[1,3,6,9]" showFirstLastButton></mat-paginator>
  </div>
